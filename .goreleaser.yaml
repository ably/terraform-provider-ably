# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2
before:
  hooks:
    # this is just an example and not a requirement for provider building/publishing
    - go mod tidy
builds:
- id: provider
  env:
    # goreleaser does not work with CGO, it could also complicate
    # usage by users in CI/CD systems like Terraform Cloud where
    # they are unable to install libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X main.VERSION={{.Version}} -X main.commit={{.Commit}}'
  goos:
    - freebsd
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm
    - arm64
  ignore:
    - goos: darwin
      goarch: '386'
  binary: '{{ .ProjectName }}_v{{ .Version }}'
# The account exporter (see EXPORTER.md). Released alongside the provider so the
# versions match. It is a CLI rather than a plugin, so it skips the full provider
# platform matrix and stays out of the SHA256SUMS the Registry consumes (see
# checksum below).
- id: exporter
  main: ./cmd/ably-exporter
  binary: ably-exporter
  env:
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X main.VERSION={{.Version}}'
  goos:
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - arm64
archives:
- id: provider
  ids:
    - provider
  formats:
    - zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
- id: exporter
  ids:
    - exporter
  formats:
    - zip
  name_template: 'ably-exporter_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
  files:
    - EXPORTER.md
    - LICENSE
checksum:
  # Provider artifacts only: the Registry reads this file to verify the provider
  # archives, and has no reason to expect exporter entries.
  ids:
    - provider
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # if you are using this in a GitHub action or some other automated pipeline, you
      # need to pass the batch flag to indicate its not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # If you want to manually examine the release before its live, uncomment this line:
  draft: true
# changelog:
#   skip: true
